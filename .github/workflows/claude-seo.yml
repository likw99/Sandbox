name: Claude Routine (SEO/GEO)

on:
  workflow_dispatch:
  # schedule:                     # uncomment in Phase 3
  #   - cron: "0 6 * * 1"        # Mondays 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      ANTHROPIC_BASE_URL: https://api.minimaxi.com/anthropic
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
      API_TIMEOUT_MS: "3000000"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ANTHROPIC_MODEL: MiniMax-M2.7
      ANTHROPIC_DEFAULT_SONNET_MODEL: MiniMax-M2.7
      ANTHROPIC_DEFAULT_OPUS_MODEL: MiniMax-M2.7
      ANTHROPIC_DEFAULT_HAIKU_MODEL: MiniMax-M2.7
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "512000"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Cache global npm installs so repeated runs are faster
      - name: Cache npm global dir
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: npm-global-claude-code-${{ runner.os }}

      - name: Install Claude Code
        run: |
          npm config set prefix "$HOME/.npm-global"
          export PATH="$HOME/.npm-global/bin:$PATH"
          npm i -g @anthropic-ai/claude-code
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      # Skip interactive onboarding on a fresh runner
      - name: Bypass Claude onboarding
        run: |
          mkdir -p "$HOME/.claude"
          echo '{"hasCompletedOnboarding": true}' > "$HOME/.claude.json"

      # ── Phase 1 task: snake game (verified ✓) ────────────────────────────
      # - name: Run snake game task
      #   run: |
      #     claude -p \
      #       "Build a single self-contained classic Snake game. Requirements:
      #        - All HTML, CSS, and JavaScript in one file: snake/index.html
      #        - Arrow key controls, smooth 60fps feel
      #        - Score counter, speed increases every 5 food items
      #        - Game-over screen with final score and restart button
      #        - Clean dark retro aesthetic, no external dependencies
      #        Write the file at snake/index.html." \
      #       --permission-mode bypassPermissions \
      #       --allowedTools "Write,Edit,Bash" \
      #       --output-format text
      # - name: Open PR (snake game)
      #   uses: peter-evans/create-pull-request@v6
      #   with:
      #     branch: claude/snake-game
      #     title: "Claude (Phase 1): Snake game proof-of-concept"
      #     commit-message: "Add snake game [Claude headless / MiniMax-M2.7]"
      #     body: |
      #       **Phase:** 1 — proof-of-concept (snake game)
      #       **Model:** MiniMax-M2.7 via `claude -p`
      #     add-paths: |
      #       snake/

      # ── Install marketing plugin (contains /marketing:seo-audit skill) ────
      - name: Install marketing plugin
        run: |
          claude plugin marketplace add anthropics/knowledge-work-plugins 2>/dev/null || true
          claude plugin install marketing@knowledge-work-plugins

      # ── Phase 2: full-site SEO audit for www.pixshop.art ─────────────────
      - name: Run SEO audit
        run: |
          DATE=$(date +%Y-%m-%d)
          claude -p \
            "Use the /marketing:seo-audit skill to run a comprehensive full-site SEO audit for https://www.pixshop.art.

             After the audit, write the full report to reports/pixshop-art-seo-${DATE}.md.

             The report must include:
             - Executive summary (top 3 priority issues)
             - Technical SEO findings (crawlability, meta tags, canonical, sitemap, robots.txt)
             - On-page SEO findings (titles, headings, content, keywords)
             - Performance signals (Core Web Vitals if detectable)
             - Actionable recommendations, prioritised as High / Medium / Low
             - Quick wins that can be implemented immediately

             Be thorough and specific to pixshop.art." \
            --permission-mode bypassPermissions \
            --allowedTools "Write,Edit,Bash,WebFetch,WebSearch" \
            --output-format text

      # ── Open PR with the audit report ─────────────────────────────────────
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: claude/seo-audit-pixshop
          title: "Claude SEO audit: pixshop.art"
          commit-message: "Add SEO audit report for pixshop.art [Claude / MiniMax-M2.7]"
          body: |
            ## Automated SEO Audit — pixshop.art

            **Skill:** `/marketing:seo-audit`
            **Target:** https://www.pixshop.art
            **Model:** MiniMax-M2.7 via `claude -p`
            **Triggered by:** ${{ github.event_name }}

            See `reports/` for the full audit report.
          add-paths: |
            reports/
