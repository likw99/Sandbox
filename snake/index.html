<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #score-bar {
      display: flex;
      justify-content: space-between;
      width: 400px;
      color: #33ff33;
      font-size: 18px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #33ff3366;
    }
    #score-bar span { min-width: 100px; }
    #score-bar span:last-child { text-align: right; }
    #canvas {
      border: 2px solid #33ff33;
      box-shadow: 0 0 20px #33ff3344, inset 0 0 60px #33ff3311;
      background: #0a0a0a;
    }
    #overlay {
      position: absolute;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      gap: 20px;
    }
    #overlay.visible { display: flex; }
    #overlay h1 {
      color: #ff3333;
      font-size: 36px;
      letter-spacing: 4px;
      text-shadow: 0 0 20px #ff333388;
    }
    #overlay p {
      color: #33ff33;
      font-size: 22px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #33ff3366;
    }
    #restart-btn {
      background: transparent;
      border: 2px solid #33ff33;
      color: #33ff33;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      padding: 10px 30px;
      cursor: pointer;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #33ff3366;
      box-shadow: 0 0 15px #33ff3333;
      transition: all 0.15s;
    }
    #restart-btn:hover {
      background: #33ff33;
      color: #0a0a0a;
      box-shadow: 0 0 25px #33ff3366;
    }
    #start-overlay {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.9);
      gap: 24px;
      z-index: 10;
    }
    #start-overlay h1 {
      color: #33ff33;
      font-size: 42px;
      letter-spacing: 6px;
      text-shadow: 0 0 30px #33ff3388;
    }
    #start-overlay p {
      color: #aaaaaa;
      font-size: 14px;
      letter-spacing: 2px;
    }
    #start-btn {
      background: transparent;
      border: 2px solid #33ff33;
      color: #33ff33;
      font-family: 'Courier New', monospace;
      font-size: 18px;
      padding: 10px 30px;
      cursor: pointer;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #33ff3366;
      box-shadow: 0 0 15px #33ff3333;
      transition: all 0.15s;
      margin-top: 8px;
    }
    #start-btn:hover {
      background: #33ff33;
      color: #0a0a0a;
      box-shadow: 0 0 25px #33ff3366;
    }
    .wrapper { position: relative; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score-bar">
      <span id="score-label">SCORE: <span id="score">0</span></span>
      <span id="speed-label">SPEED: <span id="speed">1</span></span>
    </div>
    <div class="wrapper">
      <canvas id="canvas" width="400" height="400"></canvas>
      <div id="start-overlay">
        <h1>SNAKE</h1>
        <p>USE ARROW KEYS TO MOVE</p>
        <button id="start-btn">START GAME</button>
      </div>
      <div id="overlay">
        <h1>GAME OVER</h1>
        <p>FINAL SCORE: <span id="final-score">0</span></p>
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const speedEl = document.getElementById('speed');
    const finalScoreEl = document.getElementById('final-score');
    const overlay = document.getElementById('overlay');
    const startOverlay = document.getElementById('start-overlay');
    const restartBtn = document.getElementById('restart-btn');
    const startBtn = document.getElementById('start-btn');

    const COLS = 20;
    const ROWS = 20;
    const CELL = canvas.width / COLS;

    let snake, dir, food, score, speed, gameLoop, lastTime = 0;
    let accumulator = 0;
    const BASE_STEP = 120;

    function reset() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      score = 0;
      speed = 1;
      scoreEl.textContent = '0';
      speedEl.textContent = '1';
      placeFood();
      accumulator = 0;
    }

    function placeFood() {
      let pos;
      do {
        pos = {
          x: Math.floor(Math.random() * COLS),
          y: Math.floor(Math.random() * ROWS)
        };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function drawCell(x, y, color, glow = false) {
      const px = x * CELL + 1;
      const py = y * CELL + 1;
      const size = CELL - 2;
      if (glow) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
      }
      ctx.fillStyle = color;
      ctx.fillRect(px, py, size, size);
      ctx.shadowBlur = 0;
    }

    function drawGrid() {
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }
    }

    function drawSnake() {
      snake.forEach((seg, i) => {
        const brightness = Math.max(0.4, 1 - i * 0.03);
        const green = Math.floor(255 * brightness);
        const color = `rgb(51, ${green}, 51)`;
        drawCell(seg.x, seg.y, color, i === 0);
      });
    }

    function drawFood() {
      drawCell(food.x, food.y, '#ff3333', true);
    }

    function draw(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      drawGrid();
      drawFood();
      drawSnake();
    }

    function update() {
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        gameOver();
        return;
      }

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += speed;
        scoreEl.textContent = score;
        if (score % 5 === 0) {
          speed++;
          speedEl.textContent = speed;
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function gameOver() {
      cancelAnimationFrame(gameLoop);
      finalScoreEl.textContent = score;
      overlay.classList.add('visible');
    }

    function loop(timestamp) {
      gameLoop = requestAnimationFrame(loop);
      const delta = timestamp - lastTime;
      lastTime = timestamp;
      accumulator += delta;
      const step = BASE_STEP / speed;

      while (accumulator >= step) {
        update();
        accumulator -= step;
        if (overlay.classList.contains('visible')) return;
      }

      draw(timestamp);
    }

    function startGame() {
      startOverlay.style.display = 'none';
      overlay.classList.remove('visible');
      reset();
      lastTime = performance.now();
      accumulator = 0;
      gameLoop = requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', e => {
      if (overlay.classList.contains('visible') || startOverlay.style.display === 'flex') return;
      const key = e.key;
      if (key === 'ArrowUp' && dir.y !== 1) dir = { x: 0, y: -1 };
      else if (key === 'ArrowDown' && dir.y !== -1) dir = { x: 0, y: 1 };
      else if (key === 'ArrowLeft' && dir.x !== 1) dir = { x: -1, y: 0 };
      else if (key === 'ArrowRight' && dir.x !== -1) dir = { x: 1, y: 0 };
    });

    restartBtn.addEventListener('click', startGame);
    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
